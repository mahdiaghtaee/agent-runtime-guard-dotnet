name: Feature proposal
description: Propose a concrete capability backed by a use case
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow is blocked today?
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: Suggested boundary
      description: What is the smallest interface or behavior that would solve it?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: A runnable example, protocol trace, or failing use case is preferred.
