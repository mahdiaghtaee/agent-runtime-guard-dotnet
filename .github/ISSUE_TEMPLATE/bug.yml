name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the smallest reproducible policy/request you can.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: .NET SDK, OS, and commit or release.
    validations:
      required: true
