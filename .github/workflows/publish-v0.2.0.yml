name: Publish v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v0.2.0.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists"
            exit 0
          fi

          gh release create v0.2.0 \
            --target "$GITHUB_SHA" \
            --title "v0.2.0 — Bounded local decision receipts" \
            --notes-file docs/releases/v0.2.0.md
